[package]
name = "tessera"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, native API client"

build = "build.rs"

[dependencies]
tessera-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rfd = "0.15"
open = "5"
egui = "0.31"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
